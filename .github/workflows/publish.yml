name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        # Ignore scripts to avoid running "prepare" during install; build is explicit below.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Trusted publishing authenticates with this job's OIDC token instead of a stored npm token, and needs npm 11.5.1 or later.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Publish
        run: npm publish --access public --provenance

