name: Docs dispatch

# Fires on push to main when content that affects the published docs site
# changes (docs/, README, or CHANGELOG). Notifies makegov/docs via
# repository_dispatch so the docs site rebuilds without waiting for someone
# to push to the composer.
#
# tango-node is a `coloc-source` repo: its docs/ folder is the authoritative
# source for the Node SDK pages on docs.makegov.com (see makegov/docs#15).
#
# Required secrets:
#   DOCS_DISPATCH_TOKEN — GitHub token with contents:write on makegov/docs.
#
# Required variables (optional):
#   DOCS_TARGET_REPO — override the dispatch target (default: makegov/docs).

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the push's `before` commit is reachable for the diff.
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          paths=(docs README.md CHANGELOG.md)
          if [ "$EVENT_NAME" = "push" ] && [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            external=$(git diff --name-only "$BEFORE" "$SHA" -- "${paths[@]}" | paste -sd, -)
            has_external=$([ -n "$external" ] && echo true || echo false)
          else
            # No usable push range (manual run, new branch, or a force-push whose `before` is gone): report the last commit's paths and dispatch regardless.
            base=$(git rev-parse "$SHA~1" 2>/dev/null || git rev-parse "$SHA")
            external=$(git diff --name-only "$base" "$SHA" -- "${paths[@]}" | paste -sd, -)
            has_external=true
          fi
          {
            echo "external=$external"
            echo "has_external=$has_external"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch to docs composer (makegov/docs)
        if: steps.changes.outputs.has_external == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          TARGET: ${{ vars.DOCS_TARGET_REPO || 'makegov/docs' }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
          CHANGED_PATHS: ${{ steps.changes.outputs.external }}
        run: |
          set -euo pipefail
          gh api "repos/$TARGET/dispatches" \
            -f event_type=external_updated \
            -f "client_payload[source_repo]=$SOURCE_REPO" \
            -f "client_payload[source_ref]=$SOURCE_REF" \
            -f "client_payload[changed_paths]=$CHANGED_PATHS"
